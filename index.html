<!DOCTYPE html>
<html>
<head>
    <title>Travel Planner Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat">
    <h2>✈️ Travel Planner</h2>

    <div id="messages">

    </div>

    <input id="input" placeholder="Enter destination">
    <button onclick="send()">Send</button>
</div>

<script src="script.js"></script>
</body>
</html>
